version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:16-pgdg # PostgreSQL 16 image with pgvector pre-installed
    container_name: leetcoach-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leetcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
